<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover" />
    <title>MiniLedger — Smart Friend Loan & Debt Tracker</title>
    
    <!-- Impressive Fintech Typography: Sora & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* Smooth, Warm, Humanist Design System */
      * {
        box-sizing: border-box;
      }
      body, html {
        font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #F4EFEA;
        color: #1E293B;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Custom Warm Smooth Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F4EFEA;
      }
      ::-webkit-scrollbar-thumb {
        background: #D1C7BD;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0D7A5F;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
